<!DOCTYPE html>
<!--
  ♥ 슈가슈가룬 : 하트 컬렉션 ♥ (비상업 팬게임)
  원작: 안노 모요코 『슈가슈가룬』 — 캐릭터/세계관의 권리는 원작자에게 있습니다.
  그림·음악은 이 파일에서 SVG / Web Audio로 새로 만든 팬아트입니다.
  =====================================================
  [조작법]
  - 마우스 클릭 / 터치로 조작. 대사는 클릭(또는 Space/Enter)으로 넘깁니다.
  - 여왕 후보 시험 30일. 하루는 아침 / 방과후 / 밤 3턴.
      · 수업 듣기   : 지력↑
      · 하트 모으기 : 남자아이를 골라 상황 선택지 → '아그랑디스망!'으로 하트 채취
      · 마법 연습   : 마력↑ 체력↓ (마력이 높을수록 하트 채취 성공률↑)
      · 휴식        : 체력↑
      · 마을 산책   : 랜덤 이벤트 (가끔 '에클 조각 받기' 미니게임)
      · 바닐라 대결 : 하루 1회 하트 줄다리기 — Space 연타! 이기면 바닐라의 하트를 가져온다
  - 하트를 꺼낼 때 '아그랑디스망' 타이밍 미니게임: 별이 결계 존에 올 때 Space (퍼펙트=하트 색 업그레이드)
  - 20일째 밤 오그르 습격: 클릭/터치로 오그르 퇴치
  - 👗 옷장 버튼: 에클로 옷을 사서 쇼콜라를 꾸밉니다. (턴 소모 없음, 코디 매력 보너스)
  - 💝 보석함(하트 케이스)을 누르면 모은 하트를 볼 수 있습니다.
  - 하트 가치(공식 설정): 피스 5 / 오렌지 300 / 그린 350 / 핑크 1000 /
                        바이올렛 2500 / 진홍 5000 에클.  노아르(검은 하트)는 위험!
  - 오른쪽 위 ♪ 음소거 / 💾 세이브 / 📖 로드. 매일 밤 자동 저장.
  - 30일째 밤, 캔디 여왕 앞에서 결과 발표 → 엔딩 4종.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>슈가슈가룬 하트 컬렉션</title>
<style>
:root{
  --pink:#ffc6dd; --pink2:#ff7fb6; --pink3:#e0457f;
  --plum:#2a0f2e; --plum2:#4a1846; --plum3:#7a2c6e;
  --gold:#f3c98b; --gold2:#d79a54;
  --cream:#fff6fa; --ink:#4a2245; --ink2:#8a5a86;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0820;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;max-width:880px;margin:0 auto;overflow:hidden;background:var(--plum);
  box-shadow:0 0 0 4px var(--gold2),0 0 0 8px var(--plum2),0 0 40px rgba(255,100,180,.35)}
/* 레이스 + 리본 프레임 */
#app::before,#app::after{content:"";position:absolute;left:0;right:0;height:14px;z-index:40;pointer-events:none;
  background:radial-gradient(circle at 7px 0,#ffe3ef 6px,transparent 7px) 0 0/14px 14px repeat-x,
             radial-gradient(circle at 7px 0,var(--pink2) 7.5px,transparent 8.5px) 0 0/14px 14px repeat-x}
#app::before{top:0} #app::after{bottom:0;transform:scaleY(-1)}
.corner{position:absolute;width:48px;height:48px;z-index:41;pointer-events:none}
.corner svg{width:100%;height:100%}
.c-tl{top:2px;left:2px} .c-tr{top:2px;right:2px;transform:scaleX(-1)}

/* ---------- 무대 ---------- */
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .5s}
#chars{position:absolute;left:0;right:0;bottom:0;height:72%;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.charwrap{height:100%;flex:0 1 50%;min-width:0;display:flex;align-items:flex-end;justify-content:center;transition:transform .4s,opacity .4s;animation:charIn .5s ease-out;position:relative}
.charwrap:only-child{flex-basis:72%}
.charwrap svg{max-height:100%;width:100%;height:auto;display:block;filter:drop-shadow(0 4px 8px rgba(40,0,40,.35))}
.charwrap.dim{opacity:.55;transform:scale(.94)}
.charwrap.bounce{animation:bounce .45s}
.pet{position:absolute;bottom:4%;width:26%;max-width:90px;z-index:2}
.pet svg{width:100%;height:auto}
@keyframes charIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:none}40%{transform:translateY(-14px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.petal{position:absolute;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.tone{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;
  background:radial-gradient(rgba(255,140,200,.35) 1.3px,transparent 1.6px) 0 0/7px 7px;
  -webkit-mask:radial-gradient(ellipse at center,transparent 35%,#000 80%);mask:radial-gradient(ellipse at center,transparent 35%,#000 80%)}
.tone.on{opacity:1}
.speed{position:absolute;inset:-20%;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s;
  background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,0) 0deg 4deg,rgba(255,255,255,.85) 4.4deg 5deg);
  -webkit-mask:radial-gradient(circle at 50% 45%,transparent 28%,#000 60%);mask:radial-gradient(circle at 50% 45%,transparent 28%,#000 60%)}
.speed.on{opacity:1;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.barrier{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at 50% 50%,rgba(255,180,220,0) 30%,rgba(255,120,190,.35) 60%,rgba(140,40,140,.6) 100%)}
.barrier.on{opacity:1;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{filter:hue-rotate(40deg) brightness(1.2)}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:16px;left:10px;right:10px;z-index:20;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hudrow{display:flex;gap:6px;align-items:stretch}
.panel{background:linear-gradient(#fff,#ffeef6);border:2px solid var(--gold2);border-radius:14px;padding:5px 9px;
  box-shadow:0 0 0 2px var(--plum2),0 4px 10px rgba(0,0,0,.3);pointer-events:auto}
#datebox{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
#datebox .day{font-size:20px;color:var(--pink3)}
#datebox .slot{background:var(--plum3);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px}
#stats{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px 8px;font-size:11.5px}
.stat .lbl{display:flex;justify-content:space-between}
.bar{height:7px;background:#f3e4ef;border-radius:5px;overflow:hidden;border:1px solid #f0cde0}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s}
#topbtns{display:flex;gap:6px;pointer-events:auto;position:relative;z-index:45;margin-right:34px}
#topbtns button{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold2);background:#fff;font-size:15px;padding:0;box-shadow:0 2px 0 var(--plum3)}
#topbtns button:active{transform:translateY(2px);box-shadow:none}
#rival{font-size:11.5px}
.vs{display:grid;grid-template-columns:48px 1fr 64px;align-items:center;gap:4px;margin:1px 0}
.vs b{text-align:right;font-size:11px}
.vs .bar{height:9px}
#case{position:absolute;right:12px;top:176px;z-index:21;width:66px;pointer-events:auto;cursor:pointer;text-align:center}
#case svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
#caseCount{font-size:11px;color:#fff;text-shadow:0 0 4px var(--pink3),0 0 4px var(--pink3);margin-top:-4px}
#wardBtn{position:absolute;left:12px;top:176px;z-index:21;width:58px;height:58px;border-radius:50%;border:3px solid var(--gold2);
  background:radial-gradient(#fff,#ffd6e8);font-size:24px;box-shadow:0 0 0 3px var(--plum2),0 4px 0 var(--plum3);line-height:1}
#wardBtn small{display:block;font-size:10px;color:var(--ink)}

/* ---------- 대사창 ---------- */
#dlg{position:absolute;left:10px;right:10px;bottom:18px;z-index:30;display:none}
#dlg.show{display:block;animation:pop .25s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px 18px 14px;min-height:96px;box-shadow:4px 5px 0 var(--pink3)}
.bubble::before{content:"";position:absolute;inset:5px;border:1.5px dashed var(--pink);border-radius:20px;pointer-events:none}
.bubble.tail::after{content:"";position:absolute;top:-22px;left:var(--tail,50%);width:26px;height:26px;background:#fff;
  border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:skewX(-18deg) rotate(45deg) translateY(10px)}
.bubble.shout{border-radius:8px;clip-path:polygon(0 8%,4% 0,12% 6%,22% 0,34% 5%,46% 0,58% 6%,70% 0,82% 5%,92% 0,100% 8%,97% 30%,100% 55%,97% 80%,100% 100%,85% 95%,70% 100%,50% 95%,30% 100%,12% 96%,0 100%,3% 70%,0 45%,3% 22%)}
.bubble.thought{border-style:dotted}
.bubble.narr{background:linear-gradient(#fff4fa,#fff);border-color:var(--plum3);border-radius:6px;font-style:italic}
.nameplate{position:absolute;top:-16px;left:18px;background:linear-gradient(var(--pink2),var(--pink3));color:#fff;padding:3px 14px;border-radius:14px;font-size:14px;border:2px solid #fff;box-shadow:0 2px 0 var(--plum3);z-index:2}
#dlgText{font-size:16px;line-height:1.6;min-height:52px;white-space:pre-wrap;position:relative;z-index:1}
#dlgNext{position:absolute;right:16px;bottom:6px;color:var(--pink2);animation:blink 1s infinite;font-size:14px}
@keyframes blink{50%{opacity:.2}}
#choices{display:flex;flex-direction:column;gap:7px;margin-top:6px;position:relative;z-index:2}
.choice{background:linear-gradient(#fff,#ffeef6);border:2px solid var(--pink2);border-radius:20px;padding:8px 12px;font-size:15px;color:var(--ink);box-shadow:0 3px 0 var(--pink);text-align:left}
.choice:hover{background:linear-gradient(#fff,#ffdced)}
.choice:active{transform:translateY(2px);box-shadow:none}

/* ---------- 행동 메뉴 ---------- */
#menu{position:absolute;left:8px;right:8px;bottom:18px;z-index:25;display:none}
#menu.show{display:block;animation:pop .3s}
#menuTitle{text-align:center;font-size:15px;margin-bottom:6px;color:#fff;text-shadow:0 0 4px var(--pink3),0 0 8px var(--pink3)}
#acts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.act{background:linear-gradient(#fff,#ffeaf4);border:2.5px solid var(--gold2);border-radius:18px;padding:8px 2px 6px;font-size:13px;color:var(--ink);
  box-shadow:0 0 0 2px var(--plum2),0 4px 0 var(--plum3);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.act .ico{font-size:24px;line-height:1}
.act small{font-size:10px;color:var(--ink2)}
.act:active{transform:translateY(3px);box-shadow:none}
.act:disabled{opacity:.45;filter:grayscale(.6)}
#npcPick{display:none;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
#npcPick.show{display:grid}
.npcbtn{background:#fff;border:2px solid var(--pink2);border-radius:14px;padding:4px 2px;font-size:11.5px;color:var(--ink)}
.npcbtn .hearts{color:var(--pink3);font-size:10px;display:block}
.npcbtn:disabled{opacity:.4}

/* ---------- 토스트 / 하트 연출 ---------- */
#toasts{position:absolute;top:44%;left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{background:rgba(255,255,255,.96);border:2px solid var(--pink2);border-radius:16px;padding:4px 14px;font-size:14px;animation:toast 1.9s forwards;box-shadow:0 3px 0 var(--plum3);display:flex;align-items:center;gap:4px}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.flyheart{position:absolute;z-index:36;width:40px;height:40px;pointer-events:none}
.flyheart svg{width:100%;height:100%;animation:twinkle .3s infinite alternate}
@keyframes twinkle{to{filter:brightness(1.4) drop-shadow(0 0 8px #fff)}}
.sparkle{position:absolute;z-index:36;pointer-events:none;color:#fff;text-shadow:0 0 6px #ffd6f0,0 0 10px #ff8fbf;animation:sp .8s forwards}
@keyframes sp{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(90deg)}}
.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:flash .6s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}

/* ---------- 화면들 ---------- */
.screen{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.screen.show{display:flex}
#title{background:linear-gradient(180deg,#1b0a3a 0%,#40195e 55%,#7a2c6e 100%);overflow:hidden}
#titleSky{position:absolute;inset:0;width:100%;height:100%}
#book{position:relative;width:min(300px,72vw);aspect-ratio:3/4;perspective:1200px;margin-bottom:16px}
#bookPage{position:absolute;inset:0;border-radius:6px 14px 14px 6px;background:linear-gradient(90deg,#f6e6d2,#fff8ee 12%,#fff8ee);
  box-shadow:inset 10px 0 18px rgba(120,60,40,.25),0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
#bookCover{position:absolute;inset:0;border-radius:6px 14px 14px 6px;transform-origin:left center;transition:transform 1.6s cubic-bezier(.6,.05,.3,1);transform-style:preserve-3d;
  background:linear-gradient(135deg,#5a2a6e,#2e1240);border:3px solid var(--gold2);box-shadow:inset 0 0 0 8px #3e1a52,inset 0 0 0 10px var(--gold2),0 10px 30px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;backface-visibility:hidden;cursor:pointer}
#bookCover.open{transform:rotateY(-165deg)}
#bookCover .emb{width:60%;opacity:.9}
.logo{font-size:clamp(26px,7vw,40px);line-height:1.05;color:#ff7fb6;-webkit-text-stroke:1.5px #8a1d4f;text-shadow:3px 3px 0 #ffd0e6;margin:4px 0;transform:rotate(-3deg)}
.logo small{display:block;font-size:.45em;color:#7a2c6e;-webkit-text-stroke:0;text-shadow:none;letter-spacing:2px;white-space:nowrap}
.fanNote{font-size:10.5px;color:#8a5a86;margin-top:6px}
.bigbtn{position:relative;display:block;width:200px;margin:6px auto;padding:9px;border-radius:30px;border:3px solid #fff;font-size:16px;color:#fff;
  background:linear-gradient(var(--pink2),var(--pink3));box-shadow:0 4px 0 #a02a5c,0 6px 14px rgba(200,60,120,.3)}
.bigbtn.alt{background:linear-gradient(#a07ad8,#6a3fa8);box-shadow:0 4px 0 #44236e}
.bigbtn:active{transform:translateY(4px);box-shadow:none}
.bigbtn:disabled{opacity:.5}
#tapHint{color:#ffd6ea;font-size:13px;animation:blink 1.4s infinite;margin-top:8px;position:relative}
#ending{background:radial-gradient(ellipse at 50% 30%,#fff 0%,#ffd8ea 40%,#7a2c6e 100%);overflow-y:auto;justify-content:flex-start;padding-top:40px}
#ending.noir{background:radial-gradient(ellipse at 50% 30%,#6a4a7a 0%,#2a0f2e 60%,#000 100%)}
#ending h2{font-size:28px;color:var(--pink3);-webkit-text-stroke:1px #fff;text-shadow:3px 3px 0 var(--plum3);margin:6px 0}
#ending .etext{background:#fff;border:3px double var(--pink2);border-radius:18px;padding:14px;line-height:1.7;max-width:540px;font-size:15px;white-space:pre-wrap;text-align:left}
#ending .score{margin:10px;font-size:14px;color:#fff;text-shadow:0 0 4px var(--plum)}
#endingArt{height:34vh;max-height:280px;display:flex;justify-content:center}
#endingArt svg{height:100%;width:auto}
.modal{background:rgba(26,8,32,.7)}
.modal .inner{background:linear-gradient(#fff,#fff0f7);border:3px solid var(--gold2);box-shadow:0 0 0 3px var(--plum2);border-radius:20px;padding:16px;max-width:380px;width:100%;max-height:86%;overflow:auto}
.heartRow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px;text-align:left}
.heartRow svg{width:26px;height:26px;flex:none}

/* ---------- 옷장 (드레스업) ---------- */
#ward{background:
  linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%) 0 0/28px 28px,
  linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%) 14px 14px/28px 28px,
  radial-gradient(ellipse at center,#4a1846,#22091f);padding:20px 12px 18px;justify-content:flex-start}
#wardHead{color:#fff;font-size:18px;text-shadow:0 0 6px var(--pink3);margin-bottom:6px;display:flex;gap:10px;align-items:center;justify-content:center}
#wardHead .ecru{background:#fff;color:var(--pink3);border-radius:12px;padding:2px 10px;font-size:13px;border:2px solid var(--gold2)}
#wardBody{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1.25fr);gap:10px;width:100%;flex:1;min-height:0}
#tabs{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.tab{position:relative;height:46px;border-radius:12px 22px 22px 12px;border:2px solid var(--gold2);background:linear-gradient(#ffe6f0,#ffc6dd);padding:0 0 0 18px;display:flex;align-items:center;justify-content:center}
.tab::before{content:"";position:absolute;left:4px;top:50%;width:12px;height:12px;transform:translateY(-50%) rotate(45deg);background:radial-gradient(circle at 30% 30%,#fff,#ff4f8f);border-radius:2px}
.tab svg{width:26px;height:26px}
.tab.on{background:linear-gradient(#fff,#ffd6e8);box-shadow:0 0 0 3px var(--pink2),0 0 12px #ff7fb6}
#mirror{position:relative;border-radius:120px 120px 20px 20px;border:4px solid var(--gold2);box-shadow:0 0 0 4px var(--plum2),inset 0 0 20px rgba(0,0,0,.4);overflow:hidden;min-height:0;background:#3b1638}
#mirror svg.room{position:absolute;inset:0;width:100%;height:100%}
#mirrorChar{position:absolute;left:0;right:0;bottom:2%;top:6%;display:flex;justify-content:center}
#mirrorChar svg{height:100%;width:auto}
#coordBadge{position:absolute;left:8px;right:8px;bottom:6px;background:rgba(255,255,255,.9);border-radius:12px;font-size:12px;padding:3px;border:2px solid var(--pink2)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow-y:auto;align-content:start;padding:4px}
.item{position:relative;background:linear-gradient(#5a2050,#3a1238);border:2px solid var(--gold2);border-radius:12px;padding:12px 4px 4px;color:#fff;font-size:11.5px;text-align:center}
.item .pv{height:84px;display:flex;justify-content:center;align-items:center}
.item .pv svg{height:100%;width:auto}
.item .gem{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:22px;height:20px}
.item .price{display:block;color:var(--gold);font-size:10.5px}
.item.on{box-shadow:0 0 0 3px #fff,0 0 14px #ff7fb6;background:linear-gradient(#8a2f72,#5a1a52)}
.item.locked .pv{filter:brightness(.55) saturate(.6)}
#wardClose{margin-top:8px}

@media (max-width:560px){
  #stats{grid-template-columns:repeat(2,1fr)}
  #acts{grid-template-columns:repeat(3,1fr)}
  #npcPick{grid-template-columns:repeat(3,1fr)}
  .act{padding:6px 2px 4px} .act .ico{font-size:20px}
  #dlgText{font-size:15px}
  #case{width:54px;top:196px} #wardBtn{top:196px;width:50px;height:50px;font-size:20px}
  #wardBody{grid-template-columns:50px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  #tabs{grid-row:1/3} #grid{grid-column:2;grid-template-columns:repeat(3,1fr)}
  .item .pv{height:60px}
  .tab{height:40px;padding-left:14px} .tab svg{width:22px;height:22px}
  .corner{width:44px;height:44px}
}
</style>
</head>
<body>
<div id="app">

/* ---------- 얼굴 ---------- */
function drawFace(c, face, g){
  let s='';
  s+=`<ellipse cx="116" cy="166" rx="14" ry="7" fill="url(#${g}b)"/><ellipse cx="184" cy="166" rx="14" ry="7" fill="url(#${g}b)"/>`;
  for(const [ex,fl] of [[124,1],[176,-1]]){
    if(face==='smile'){
      s+=`<path d="M${ex-14},146 Q${ex},130 ${ex+14},146" fill="none" stroke="#3a1a30" stroke-width="4.5" stroke-linecap="round"/>`;
      s+=`<path d="M${ex+fl*-14},141 l${fl*-6},-4" stroke="#3a1a30" stroke-width="3" stroke-linecap="round"/>`;
    }else{
      const p = face==='panic', ir=p?7:12, iry=p?9:16;
      s+=`<ellipse cx="${ex}" cy="144" rx="14" ry="18" fill="#fff"/>`;
      s+=`<ellipse cx="${ex}" cy="${p?143:146}" rx="${ir}" ry="${iry}" fill="url(#${g}i)"/>`;
      s+=`<ellipse cx="${ex}" cy="${p?143:145}" rx="${ir*.45}" ry="${iry*.45}" fill="#140a14"/>`;
      s+=`<circle cx="${ex-4}" cy="${p?139:138}" r="${p?2.5:5}" fill="#fff"/><circle cx="${ex+5}" cy="153" r="${p?1.2:2.5}" fill="#fff"/>`;
      if(!p) s+=`<path d="${starPath(ex+6,139,3.5,1.4,4,0)}" fill="#fff"/>`;
      s+=`<path d="M${ex-16},132 Q${ex},121 ${ex+16},132" fill="none" stroke="#3a1a30" stroke-width="4.5" stroke-linecap="round"/>`;
      s+=`<path d="M${ex+fl*-16},131 l${fl*-7},-6 M${ex+fl*-15},135 l${fl*-7},-1" stroke="#3a1a30" stroke-width="2.6" stroke-linecap="round"/>`;
    }
    const by = face==='panic'?112:116, t = face==='panic'?fl*-5:0;
    s+=`<path d="M${ex-10},${by+t} Q${ex},${by-4} ${ex+10},${by-t}" fill="none" stroke="${c.hair2}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  if(c.glasses) s+=`<g fill="none" stroke="#5a5a7a" stroke-width="2.5"><rect x="104" y="126" width="40" height="36" rx="10"/><rect x="156" y="126" width="40" height="36" rx="10"/><path d="M144,142 L156,142"/></g>`;
  if(c.shades) s+=`<path d="M100,132 L146,132 L142,154 Q124,160 106,152Z M154,132 L200,132 L194,152 Q176,160 158,154Z" fill="#1a1020" opacity=".92"/><path d="M146,136 L154,136" stroke="#1a1020" stroke-width="3"/>`;
  if(face==='smile') s+=`<path d="M138,170 Q150,188 162,170 Z" fill="#e8607f" stroke="#a53a5a" stroke-width="2"/>`;
  else if(face==='panic') s+=`<path d="M136,176 q4,-5 7,0 q4,5 7,0 q4,-5 7,0 q4,5 7,0" fill="none" stroke="#a53a5a" stroke-width="2.4" stroke-linecap="round"/>`;
  else s+=`<path d="M142,173 Q150,179 158,173" fill="none" stroke="#a53a5a" stroke-width="2.4" stroke-linecap="round"/>`;
  return s;
}

/* ---------- 전신 그리기 ---------- */
/* id: PEOPLE 또는 BOYS 키. look: 쇼콜라 코디. crop: 'full' | 'upper' | viewBox 문자열 */
function drawPerson(id, face='normal', crop='upper', look=null){
  const base = PEOPLE[id] && !PEOPLE[id].pet ? PEOPLE[id] : BOYS[id];
  if(PEOPLE[id] && PEOPLE[id].pet) return drawPet(PEOPLE[id].pet, face);
  const c = Object.assign({}, base);
  if(id==='pierre') Object.assign(c, PEOPLE.pierre);
  const L = id==='chocolat' ? Object.assign({}, DEFAULT_LOOK, look||{}) : Object.assign({}, c.look||{});
  const boy = c.boy || BOYS[id] && !BOYS[id].special;
  const g = uid('p'), hg = `url(#${g}h)`;
  const vb = crop==='full' ? '0 -50 300 670' : crop==='upper' ? '40 -40 220 380' : crop;
  let s = `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="${g}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.hair}"/><stop offset="1" stop-color="${c.hair2}"/></linearGradient>
    <linearGradient id="${g}i" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a1a"/><stop offset=".5" stop-color="${c.eye}"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <radialGradient id="${g}b"><stop offset="0" stop-color="#ff7fa8" stop-opacity=".7"/><stop offset="1" stop-color="#ff7fa8" stop-opacity="0"/></radialGradient>
    <pattern id="${g}st" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="8" fill="#fff"/><rect y="8" width="20" height="8" fill="#2a1428"/></pattern></defs>`;
  const hairSt = boy ? (c.style||L.hair||'boyNeat') : L.hair;
  /* 망토(뒤) */
  if(!boy && L.top==='capeTop' && (!L.dress || L.dress==='noDress')) s += DRAW.capeTop().match(/<path[^>]*data-layer="back"\/>/)[0];
  s += backHair(id==='pierre'?'boyLong':id==='robin'?'rocker':hairSt, hg);
  if(boy){
    const u = (c.look&&c.look.uniform) || c.uniform || '#3c4a7a', tie = (c.look&&c.look.tie) || c.tie;
    s+=[137,163].map(x=>`<rect x="${x-13}" y="300" width="26" height="290" fill="#2a2a3a"/><path d="M${x-14},590 L${x+12},590 Q${x+26},598 ${x+24},610 L${x-14},610Z" fill="#3a2a2a"/>`).join('');
    s+=torso(u,'#1a1a2a')+sleeves(u,false,'#1a1a2a');
    s+=`<path d="M128,206 L150,270 L172,206 Z" fill="#fff"/><path d="M145,214 L155,214 L157,262 L150,272 L143,262Z" fill="${tie}"/>`;
    s+=`<path d="M128,206 L150,280 L120,300 L106,306 L104,230Z M172,206 L150,280 L180,300 L194,306 L196,230Z" fill="${u}" stroke="#1a1a2a" stroke-width="2"/>`;
    if(c.look&&c.look.jacket) s+=`<path d="M104,214 L130,300 M196,214 L170,300" stroke="#e0457f" stroke-width="3"/><path d="${starPath(116,262,6,2.5)}" fill="#e0457f"/>`;
    else s+=`<circle cx="118" cy="270" r="5" fill="${P.gold}"/>`;
  }else{
    /* 다리 + 줄무늬 스타킹 */
    const leg = id==='chocolat' ? `url(#${g}st)` : c.skin;
    s+=[137,163].map(x=>`<rect x="${x-11}" y="330" width="22" height="270" rx="10" fill="${leg}" stroke="${SK}" stroke-width="2"/>`).join('');
    s+=(DRAW[L.shoes]||(()=>''))();
    const hasDress = L.dress && L.dress!=='noDress';
    if(hasDress) s+=DRAW[L.dress]();
    else { s+=(DRAW[L.bottom]||(()=>''))(); s+=(DRAW[L.top]||(()=>'')) ().replace(/<path[^>]*data-layer="back"\/>/,''); }
  }
  /* 손 */
  s+=`<circle cx="94" cy="312" r="9" fill="${c.skin}" stroke="${SK}" stroke-width="1.5"/><circle cx="206" cy="312" r="9" fill="${c.skin}" stroke="${SK}" stroke-width="1.5"/>`;
  /* 목 + 얼굴 */
  s+=`<rect x="139" y="180" width="22" height="34" fill="${c.skin}"/><path d="M139,200 Q150,210 161,200 L161,212 L139,212Z" fill="#000" opacity=".08"/>`;
  if(!boy) s+=(DRAW[L.neck]||(()=>''))();
  s+=`<ellipse cx="150" cy="112" rx="66" ry="64" fill="${hg}"/>`;
  if(c.ears) s+=`<path d="M96,138 L66,112 L100,160Z M204,138 L234,112 L200,160Z" fill="${c.skin}" stroke="${SK}" stroke-width="1.5"/>`;
  else s+=`<ellipse cx="92" cy="146" rx="8" ry="12" fill="${c.skin}"/><ellipse cx="208" cy="146" rx="8" ry="12" fill="${c.skin}"/>`;
  s+=`<path d="M92,118 Q92,182 150,196 Q208,182 208,118 Z" fill="${c.skin}"/>`;
  s+=drawFace(c, face, g);
  if(!boy) s+=(DRAW[L.ear]||(()=>''))();
  s+=frontHair(id==='pierre'?'boyLong':id==='robin'?'rocker':hairSt, hg, c.hair2);
  s+=`<path d="M110,72 Q128,62 148,62" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/>`;
  if(L.hair==='twin' && !boy) s+=`<circle cx="94" cy="104" r="8" fill="${P.hot}"/><circle cx="206" cy="104" r="8" fill="${P.hot}"/>`;
  if(!boy) s+=(DRAW[L.ribbon]||(()=>''))();
  if(!boy) s+=(DRAW[L.hat]||(()=>''))();
  if(c.crown) s+=`<path d="M112,52 L124,18 L138,42 L150,10 L162,42 L176,18 L188,52 Z" fill="${P.gold}" stroke="#b07a30" stroke-width="2"/><circle cx="150" cy="30" r="5" fill="${P.hot}"/>`;
  if(face==='panic') s+=`<path d="M214,98 Q224,114 214,122 Q204,114 214,98Z" fill="#bfe6ff" stroke="#6fb2e0" stroke-width="2"/>`;
  if(face==='smile') s+=`<path d="${starPath(232,110,9,3.2,4,0)}" fill="#fff6a8"/><path d="${heartD(70,150,7)}" fill="#ffb3d1"/>`;
  return s+'</svg>';
}

    ${[40,58,76].map(x=>`<path d="M${x},44 Q${x+4},72 ${x},104" stroke="#1a0a0e" stroke-width="7" fill="none"/>`).join('')}

<script>
/* =========================================================
   3. 사운드 — Web Audio API 오리지널 작곡
   ========================================================= */
const Snd = (() => {
  let ctx=null, master=null, musicBus=null, sfxBus=null, muted=false;
  let theme=null, nextTime=0, step=0, timer=null;
  const mtof = m => 440*Math.pow(2,(m-69)/12);

  function init(){
    if(ctx) { if(ctx.state==='suspended') ctx.resume(); return; }
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = muted?0:.8; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value=.38; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value=.6; sfxBus.connect(master);
      /* 간단한 리버브 느낌의 딜레이 */
      const d = ctx.createDelay(); d.delayTime.value=.27; const fb=ctx.createGain(); fb.gain.value=.28;
      const wet=ctx.createGain(); wet.gain.value=.25; musicBus.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(master);
    }catch(e){ ctx=null; }
  }

  /* --- 악기 --- */
  function musicBox(m,t,dur,vol=.22,bus=musicBus){
    const f=mtof(m), g=ctx.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.6,dur*1.6));
    g.connect(bus);
    [[f,'triangle',1],[f*2,'sine',.35],[f*4.02,'sine',.12]].forEach(([fr,ty,v])=>{
      const o=ctx.createOscillator(), og=ctx.createGain(); o.type=ty; o.frequency.value=fr; og.gain.value=v;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+Math.max(.7,dur*1.7));
    });
  }
  function bell(m,t,vol=.16,bus=musicBus){
    const f=mtof(m), g=ctx.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+3.2);
    g.connect(bus);
    [[1,1],[2.76,.32],[5.4,.1],[0.5,.2]].forEach(([r,v])=>{
      const o=ctx.createOscillator(), og=ctx.createGain(); o.type='sine'; o.frequency.value=f*r; og.gain.value=v;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+3.3);
    });
  }
  function pad(ms,t,dur,vol=.05){
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=.5;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+1.4);
    g.gain.setValueAtTime(vol,t+dur-.6); g.gain.linearRampToValueAtTime(0,t+dur+.8);
    lp.connect(g); g.connect(musicBus);
    ms.forEach(m=>[-7,7].forEach(cent=>{
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=cent;
      o.connect(lp); o.start(t); o.stop(t+dur+1);
    }));
  }

  /* --- 낮 테마: F장조 왈츠 오르골 (3/4, 16마디) --- */
  const CH = {F:[53,57,60],C:[52,55,60],Dm:[50,53,57],Bb:[50,53,58],Am:[52,57,60]};
  const BASS = {F:41,C:48,Dm:50,Bb:46,Am:45};
  const DAY_CH = ['F','C','Dm','Bb','F','C','C','F','Dm','Am','Bb','C','F','Bb','C','F'];
  const DAY_MEL = [
    [[81,1],[84,1],[81,1]], [[79,1],[76,1],[79,1]], [[77,1.5],[81,.5],[86,1]], [[84,2],[82,1]],
    [[81,.5],[82,.5],[84,1],[89,1]], [[88,1],[86,1],[84,1]], [[86,1],[82,1],[79,1]], [[77,3]],
    [[86,.5],[84,.5],[81,1],[77,1]], [[76,1],[81,1],[84,1]], [[86,1.5],[84,.5],[82,1]], [[81,1],[79,1],[76,1]],
    [[77,.5],[81,.5],[84,1],[81,1]], [[86,1],[89,1],[86,1]], [[84,1],[88,1],[91,1]], [[89,2],[0,1]]
  ];
  function dayBar(bar,t,beat){
    const ch=DAY_CH[bar%16];
    musicBox(BASS[ch]+12,t,beat,.13);
    musicBox(CH[ch][0]+12,t+beat,beat*.5,.07); musicBox(CH[ch][1]+12,t+beat,beat*.5,.07);
    musicBox(CH[ch][1]+12,t+beat*2,beat*.5,.07); musicBox(CH[ch][2]+12,t+beat*2,beat*.5,.07);
    let o=0; DAY_MEL[bar%16].forEach(([m,d])=>{ if(m) musicBox(m,t+o*beat,d*beat,.17); o+=d; });
    return beat*3;
  }
  /* --- 밤 테마: 몽환적인 벨 + 패드 (4/4) --- */
  const NIGHT = [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59],[46,50,53,57],[45,48,52,55],[43,48,50,55],[48,52,55,60]];
  const ARP = [[3,0],[1.5,2],[2.5,1],[3.5,3]];
  function nightBar(bar,t,beat){
    const ch=NIGHT[bar%8];
    pad(ch,t,beat*4,.035);
    bell(ch[0]-12,t,.09);
    ARP.forEach(([b,i],k)=>{ if(bar%2 && k===3) return; bell(ch[i]+24,t+b*beat,.07+(k===0?.03:0)); });
    if(bar%4===3) bell(ch[3]+36,t+beat*3.5,.05);
    return beat*4;
  }
  /* --- 대결 테마: A단조 질주 아르페지오 (4/4) --- */
  const BAT=[[45,57,60,64],[41,53,57,60],[43,55,59,62],[40,52,56,59]];
  function battleBar(bar,t,beat){
    const ch=BAT[bar%4];
    for(let i=0;i<4;i++) musicBox(ch[0]-12+(i%2?12:0),t+i*beat,beat*.5,.12);
    [0,1,2,3,2,1,2,3].forEach((k,i)=>musicBox(ch[k]+12,t+i*beat/2,beat*.4,.09));
    bell(ch[3]+24-(bar%2?0:5),t,.06); if(bar%2) bell(ch[2]+24,t+beat*2,.05);
    return beat*4;
  }
  const THEMES = { day:{fn:dayBar,beat:60/138}, night:{fn:nightBar,beat:60/58}, battle:{fn:battleBar,beat:60/168} };

  function tick(){
    if(!ctx || !theme) return;
    while(nextTime < ctx.currentTime + .3){
      const th=THEMES[theme]; nextTime += th.fn(step++, nextTime, th.beat);
    }
  }
  function play(name){
    if(theme===name && timer) return;
    theme=name; if(!ctx) return;
    step=0; nextTime=ctx.currentTime+.15;
    if(!timer) timer=setInterval(tick,60);
  }
  function stop(){ theme=null; }

  /* --- 효과음 --- */
  function sfx(type){
    if(!ctx || muted) return;
    const t=ctx.currentTime+.01;
    if(type==='click'){ musicBox(96,t,.08,.12,sfxBus); }
    else if(type==='shard'){ [84,88,91,96,100].forEach((m,i)=>bell(m,t+i*.06,.12,sfxBus)); }
    else if(type==='sad'){ [72,68,63].forEach((m,i)=>bell(m,t+i*.16,.1,sfxBus)); }
    else if(type==='level'){ [72,76,79,84].forEach((m,i)=>musicBox(m,t+i*.08,.2,.2,sfxBus)); musicBox(88,t+.34,.6,.22,sfxBus); }
    else if(type==='tick'){ musicBox(rnd(84,91),t,.05,.08,sfxBus); }
    else if(type==='fanfare'){
      const seq=[[72,0,.2],[72,.18,.2],[72,.36,.2],[77,.56,.6],[76,1.1,.2],[77,1.3,.2],[81,1.5,1.4]];
      seq.forEach(([m,o,d])=>{ musicBox(m,t+o,d,.22,sfxBus); musicBox(m-12,t+o,d,.12,sfxBus); });
      [[53,57,60,65]].forEach(c=>c.forEach(m=>bell(m+12,t+1.5,.08,sfxBus)));
      [89,93,96,101].forEach((m,i)=>bell(m,t+1.6+i*.1,.07,sfxBus));
    }
  }
  function toggleMute(){
    muted=!muted; if(master) master.gain.setTargetAtTime(muted?0:.8, ctx.currentTime, .05);
    return muted;
  }
  return {init, play, stop, sfx, toggleMute, get muted(){return muted;}, set mutedInit(v){muted=v;}};
})();
</script>
<script>
/* =========================================================
   5. 상태 / UI / 대사 엔진 / 연출
   ========================================================= */
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const wait = ms => new Promise(r=>setTimeout(r,ms));
const SAVE_KEY = 'sugarRuneHeart_save_v1';
const MUTE_KEY = 'sugarRuneHeart_mute';
document.head.insertAdjacentHTML('beforeend','<style>.charwrap.petw{flex:0 1 22%;height:30%}</style>');

let G = null;
function newState(){
  const aff={}; BOY_IDS.forEach(k=>aff[k]=0);
  const hearts={}; HEART_ORDER.forEach(k=>hearts[k]=0);
  return {day:1, slot:0, charm:12, intel:12, magic:14, hp:80, ecru:1000, score:0, hearts, aff,
    trust:0, bond:0, vanilla:0, forced:false, seenEv:[], story:{},
    owned:Object.values(DEFAULT_LOOK).concat(['noRibbon','noDress','noNeck','noEar','noHat']), look:Object.assign({},DEFAULT_LOOK)};
}
function outfit(){
  const ids=Object.values(G.look), themes={};
  let b=ids.reduce((s,id)=>s+(ITEM[id]?ITEM[id].charm:0),0);
  if(G.look.dress!=='noDress') b-= (ITEM[G.look.top].charm + ITEM[G.look.bottom].charm);
  ids.forEach(id=>{ const t=ITEM[id]&&ITEM[id].theme; if(t) themes[t]=(themes[t]||0)+1; });
  let set=null; if((themes.pink||0)>=5) set='러블리 핑크 코디'; if((themes.goth||0)>=5) set='고스로리 코디';
  if(set) b+=8;
  return {bonus:b, set};
}
function effCharm(){ return G.charm + outfit().bonus; }
function tier(a){ return a>=85?3:a>=55?2:a>=25?1:0; }
function hearts(a){ const n=Math.min(5,Math.floor(a/20)); return '♥'.repeat(n)+'♡'.repeat(5-n); }
const fmt = n => n.toLocaleString('ko-KR');

/* ---------- HUD ---------- */
function renderHUD(){
  $('hDay').textContent=G.day+'일째'; $('hSlot').textContent=SLOTS[G.slot];
  const ob=outfit().bonus;
  $('stats').innerHTML=STATS.map(s=>`<div class="stat"><div class="lbl"><span>${s.n}</span><b>${G[s.k]}${s.k==='charm'&&ob?` <small style="color:#e0457f">+${ob}</small>`:''}</b></div><div class="bar"><i style="width:${Math.min(100,G[s.k])}%;background:${s.c}"></i></div></div>`).join('');
  const me=Math.max(0,G.score), mx=Math.max(me,G.vanilla,3000)*1.1;
  $('vsMe').style.width=(me/mx*100)+'%'; $('vsMeN').textContent=fmt(G.score)+' 에클';
  $('vsRi').style.width=(G.vanilla/mx*100)+'%'; $('vsRiN').textContent=fmt(G.vanilla)+' 에클';
  const n=HEART_ORDER.reduce((s,k)=>s+G.hearts[k],0);
  $('caseSvg').innerHTML=drawCase(n); $('caseCount').textContent='하트 '+n+'개';
}
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.innerHTML=msg; $('toasts').appendChild(d); setTimeout(()=>d.remove(),2000); }

/* ---------- 배경 / 캐스트 ---------- */
let curBG='', cast=[], fxMode='petal';
function setBG(type, slot=G?G.slot:0){
  const key=type+slot; if(key===curBG) return; curBG=key;
  const bg=$('bg'); bg.style.opacity=0;
  setTimeout(()=>{ bg.innerHTML=drawBG(type,slot); bg.style.opacity=1; },220);
  const night = slot===2 || type==='makai';
  Snd.play(night?'night':'day'); fxMode = night?'star':'petal';
}
function charSVG(c){ return drawPerson(c.id, c.face, 'upper', c.id==='chocolat'?G.look:null); }
function setCast(list){
  cast=list.map(o=>({id:o.id, face:o.face||'normal'}));
  const box=$('chars'); box.innerHTML='';
  cast.forEach(c=>{ const w=document.createElement('div'); w.className='charwrap'+(PEOPLE[c.id]&&PEOPLE[c.id].pet?' petw':''); w.dataset.id=c.id; w.innerHTML=charSVG(c); box.appendChild(w); });
}
function setFace(id, face){
  const c=cast.find(x=>x.id===id); if(!c) return;
  const w=[...$('chars').children].find(x=>x.dataset.id===id);
  if(c.face!==face){ c.face=face; if(w) w.innerHTML=charSVG(c); }
  if(w && face==='smile'){ w.classList.remove('bounce'); void w.offsetWidth; w.classList.add('bounce'); }
}
function focusChar(id){ [...$('chars').children].forEach(w=>w.classList.toggle('dim', cast.length>1 && id && w.dataset.id!==id)); }
function effects({tone=false, speed=false, barrier=false}={}){
  $('tone').classList.toggle('on',tone); $('speed').classList.toggle('on',speed); $('barrier').classList.toggle('on',barrier);
}
function flash(){ const f=document.createElement('div'); f.className='flash'; $('app').appendChild(f); setTimeout(()=>f.remove(),650); }

/* ---------- 파티클 ---------- */
setInterval(()=>{
  const fx=$('fx'); if(!fx || fx.children.length>18 || document.hidden) return;
  const p=document.createElement('div'); p.className='petal';
  p.style.left=Math.random()*100+'%'; p.style.setProperty('--dx',(Math.random()*160-80)+'px');
  p.style.animationDuration=(6+Math.random()*5)+'s';
  p.innerHTML = fxMode==='star'
    ? `<svg width="12" height="12" viewBox="0 0 20 20"><path d="${starPath(10,10,9,3,4,0)}" fill="#fff6c8"/></svg>`
    : (Math.random()<.5 ? `<svg width="14" height="14" viewBox="-10 -16 24 24">${sakura(0,0,1)}</svg>` : `<svg width="12" height="12" viewBox="-12 -12 24 24"><path d="${heartD(0,-3,9)}" fill="#ffb3d1"/></svg>`);
  fx.appendChild(p); setTimeout(()=>p.remove(),11500);
},700);
function burst(x,y,n=10){
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='sparkle'; s.textContent=pick(['✦','✧','♥','♡']);
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.fontSize=rnd(12,22)+'px';
    s.style.setProperty('--dx',rnd(-70,70)+'px'); s.style.setProperty('--dy',rnd(-70,50)+'px');
    $('app').appendChild(s); setTimeout(()=>s.remove(),850); }
}

/* ---------- 하트 획득 연출: 가슴에서 튀어나와 보석함으로 ---------- */
async function gainHeart(type, fromId){
  const h=HEARTS[type];
  G.hearts[type]++;
  if(type==='noir'){ G.score+=h.ecru; G.hp=Math.max(0,G.hp-15); }
  else { G.score+=h.ecru; G.ecru+=h.ecru; }
  const app=$('app').getBoundingClientRect(), cs=$('case').getBoundingClientRect();
  let sx=app.width/2-20, sy=app.height*.45;
  const w=fromId && [...$('chars').children].find(x=>x.dataset.id===fromId);
  if(w){ const r=w.getBoundingClientRect(); sx=r.left-app.left+r.width/2-20; sy=r.top-app.top+r.height*.62; }
  const el=document.createElement('div'); el.className='flyheart'; el.innerHTML=drawHeart(type,40);
  el.style.left=sx+'px'; el.style.top=sy+'px'; el.style.transform='scale(0)'; el.style.transition='transform .4s cubic-bezier(.3,1.8,.5,1), top .4s';
  $('app').appendChild(el); burst(sx+20,sy+20,14);
  Snd.sfx(type==='noir'?'sad':'shard');
  await wait(30); el.style.transform='scale(2)'; el.style.top=(sy-60)+'px';
  await wait(800);
  el.style.transition='left .7s cubic-bezier(.5,0,.6,1), top .7s cubic-bezier(.4,-.4,.6,1), transform .7s';
  el.style.left=(cs.left-app.left+cs.width/2-20)+'px'; el.style.top=(cs.top-app.top+cs.height*.4-20)+'px'; el.style.transform='scale(.5) rotate(360deg)';
  await wait(720);
  el.remove(); burst(cs.left-app.left+cs.width/2, cs.top-app.top+cs.height/2, 6);
  $('case').animate([{transform:'scale(1)'},{transform:'scale(1.2) rotate(-6deg)'},{transform:'scale(1)'}],{duration:350});
  toast(`${drawHeart(type,18)} <b>${h.name} 하트</b> ${type==='noir'?'…검은 하트가 섞였다! ('+fmt(h.ecru)+' 에클)':'+'+fmt(h.ecru)+' 에클'}`);
  renderHUD();
}

/* ---------- 스탯 ---------- */
const STAT_NAME={charm:'매력',intel:'지력',magic:'마력',hp:'체력'};
function addStat(k,v){
  if(!v) return; const b=G[k]; G[k]=Math.max(0,Math.min(100,G[k]+v)); const d=G[k]-b; if(!d) return;
  toast(`${STAT_NAME[k]} ${d>0?'▲ +'+d:'▼ '+d}`);
  if(k!=='hp' && Math.floor(b/20)<Math.floor(G[k]/20)){ Snd.sfx('level'); setTimeout(()=>toast(`🎀 <b>${STAT_NAME[k]} 랭크 업!</b> Lv.${Math.floor(G[k]/20)+1}`),300); }
}
async function applyEff(e={}){
  ['charm','intel','magic','hp'].forEach(k=>addStat(k,e[k]));
  if(e.ecru){ G.ecru=Math.max(0,G.ecru+e.ecru); toast(`💰 용돈 ${e.ecru>0?'+':''}${fmt(e.ecru)} 에클`); }
  if(e.bond){ G.bond=Math.min(100,G.bond+e.bond); toast(`바닐라와의 우정 ♣ +${e.bond}`); }
  if(e.pierre){ G.aff.pierre=Math.min(100,G.aff.pierre+e.pierre); toast(`피에르 ❄ +${e.pierre}`); }
  if(e.trust){ G.trust+=e.trust; }
  renderHUD();
  if(e.heart){ await wait(250); await gainHeart(e.heart, e.from); }
}

/* ---------- 대사 엔진 ---------- */
let advance=null, typing=false, skipType=false;
function nameOf(who){ if(who==='narr') return ''; if(PEOPLE[who]) return PEOPLE[who].name; if(BOYS[who]) return BOYS[who].name; return who; }
async function say(who, text, opt={}){
  const dlg=$('dlg'), b=$('bubble');
  $('menu').classList.remove('show'); dlg.classList.add('show');
  b.className='bubble '+(opt.style||(who==='narr'?'narr':'tail'));
  const idx=cast.findIndex(c=>c.id===who);
  if(idx>=0) b.style.setProperty('--tail', cast.length>1 ? (15+idx*70/(cast.length-1))+'%' : '50%');
  $('dlgName').style.display = who==='narr'?'none':'block'; $('dlgName').textContent=nameOf(who);
  if(opt.face) setFace(who,opt.face);
  focusChar(idx>=0?who:null); effects(opt); if(opt.flash) flash();
  $('choices').innerHTML=''; $('dlgNext').style.display='none';
  const t=$('dlgText'); t.textContent=''; typing=true; skipType=false;
  for(let i=0;i<text.length;i++){ if(skipType){ t.textContent=text; break; } t.textContent+=text[i]; await wait(text[i]==='\n'?110:22); }
  typing=false; $('dlgNext').style.display='block';
  await new Promise(r=>advance=r); advance=null;
}
function choose(opts){
  return new Promise(res=>{
    $('dlg').classList.add('show'); $('dlgNext').style.display='none';
    const box=$('choices'); box.innerHTML='';
    opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='choice'; b.textContent='♥ '+o;
      b.onclick=ev=>{ ev.stopPropagation(); Snd.sfx('click'); box.innerHTML=''; res(i); }; box.appendChild(b); });
  });
}
function hideDlg(){ $('dlg').classList.remove('show'); effects(); }
function onAdvance(){ if(typing){ skipType=true; return; } if(advance){ Snd.sfx('click'); advance(); } }
$('dlg').addEventListener('click', onAdvance);
document.addEventListener('keydown', e=>{ if(typeof miniActive!=='undefined' && miniActive) return; if((e.key===' '||e.key==='Enter') && $('dlg').classList.contains('show')){ e.preventDefault(); onAdvance(); } });

/* ---------- 세이브 / 로드 ---------- */
let canSave=false;
function saveGame(silent){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); if(!silent) toast('💾 저장했어요!'); return true; }
  catch(e){ if(!silent) toast('저장할 수 없어요 (저장소 사용 불가)'); return false; }
}
function loadData(){ try{ const s=localStorage.getItem(SAVE_KEY); if(!s) return null; const d=JSON.parse(s); return d&&d.day?d:null; }catch(e){ return null; } }

<script>
/* =========================================================
   6. 게임 진행
   ========================================================= */
const SLOT_BG=['classroom','road','room'];
let menuResolve=null;
const nm = (s,n) => s.replace(/\{n\}/g,n);

function showMenu(){
  return new Promise(res=>{
    hideDlg(); focusChar(null); canSave=true; menuResolve=res;
    $('menuTitle').textContent=`♥ ${G.day}일째 ${SLOTS[G.slot]} — 무엇을 할까? ♥`;
    $('acts').innerHTML='';
    ACTIONS.forEach(a=>{
      const b=document.createElement('button'); b.className='act';
      b.innerHTML=`<span class="ico">${a.ico}</span>${a.name}<small>${a.id==='heart'&&G.slot===2?'밤엔 불가':a.hint}</small>`;
      if(a.id==='magic' && G.hp<10) b.disabled=true;
      if(a.id==='heart' && G.slot===2) b.disabled=true;
      if(a.id==='duel' && (!G.story.duel || G.duelDay===G.day)){ b.disabled=true; b.querySelector('small').textContent=G.story.duel?'오늘은 끝':'5일째 해금'; }
      b.onclick=()=>{ Snd.sfx('click'); if(a.id==='heart'){ $('npcPick').classList.toggle('show'); return; } finish({act:a.id}); };
      $('acts').appendChild(b);
    });
    const np=$('npcPick'); np.classList.remove('show'); np.innerHTML='';
    BOY_IDS.forEach(id=>{
      const n=BOYS[id], b=document.createElement('button'); b.className='npcbtn';
      b.innerHTML=`${n.name}<span class="hearts">${hearts(G.aff[id])}</span>`; b.title=n.desc;
      if(id==='pierre' && !G.story.metP) b.disabled=true;
      b.onclick=()=>{ Snd.sfx('click'); finish({act:'heart', boy:id}); };
      np.appendChild(b);
    });
    $('menu').classList.add('show');
    function finish(r){ canSave=false; menuResolve=null; $('menu').classList.remove('show'); res(r); }
  });
}

/* ---------- 하트 모으기 ---------- */
async function casting(boy){
  await say('chocolat','아그랑디스망!!', {style:'shout', face:'smile', barrier:true, speed:true, flash:true});
  const r = await timingGame();
  if(r==='miss'){ setFace('chocolat','panic'); await say('narr','결계가 흔들리더니 하트가 다시 가슴 속으로 쏙 들어가 버렸다…!',{}); return false; }
  if(r==='perfect') await say('narr',`✨ 퍼펙트! 결계가 완벽하게 안정되어 ${BOYS[boy].name}의 하트가 한층 깊은 색으로 빛난다!`,{barrier:true, tone:true, flash:true});
  else await say('narr',`결계 속, ${BOYS[boy].name}의 가슴에서 하트 결정이 떠오른다…!`,{barrier:true, tone:true});
  return r;
}
function heartColor(boy, type){
  if(type==='friend') return 'green';
  if(type==='clumsy') return Math.random()<(G.day>10?.18:.08) ? 'noir' : 'pis';
  const v = G.aff[boy] + effCharm()/2 + (G[BOYS[boy].likes]>=40?10:0);
  if(v>=128 && G.magic>=50) return 'crimson';
  if(v>=96) return 'violet';
  if(v>=58) return 'pink';
  return 'orange';
}
async function doHeart(boy){
  if(boy==='pierre') return doPierre();
  const B=BOYS[boy];
  setBG(SLOT_BG[G.slot]); setCast([{id:'chocolat'},{id:boy}]);
  const sit=pick(SITUATIONS);
  await say('narr',`💗 「${sit.title}」`,{tone:true});
  await say('narr', nm(sit.intro,B.name));
  const order=[0,1,2].sort(()=>Math.random()-.5);
  const i=order[await choose(order.map(k=>nm(sit.ch[k].l,B.name)))];
  const c=sit.ch[i];
  setFace(boy, c.type==='clumsy'?'panic':'smile'); setFace('chocolat', c.type==='clumsy'?'panic':'smile');
  await say('narr', nm(c.t,B.name), {tone:c.type==='romance'});
  const gain = c.type==='romance' ? 15 + (G[B.likes]>=40?6:0) : c.type==='friend' ? 9 : -3;
  G.aff[boy]=Math.max(0,Math.min(100,G.aff[boy]+gain));
  toast(`${B.name} 마음 ${gain>0?'♥ +'+gain:'💦 '+gain}`);
  if(c.type==='clumsy' && Math.random()<.4){ await say('chocolat','(으… 또 성질부렸다…)',{style:'thought'}); addStat('charm',1); return; }
  let col=heartColor(boy, c.type);
  if(c.type!=='clumsy'){
    setCast([{id:'chocolat'},{id:boy},{id:'duke'}]);
    await say('duke', `${B.name}의 하트가 보인다. 지금 꺼내면… ${HEARTS[col].name} 하트(${fmt(HEARTS[col].ecru)} 에클) 정도겠군.`, {});
    const k=await choose(['「아그랑디스망!」 지금 하트를 꺼낸다', '아직이야… 마음이 더 자랄 때까지 기다린다']);
    if(k===1){ await say('chocolat','(조금만 더… 더 반짝이는 하트가 될 때까지!)',{style:'thought', face:'smile'}); addStat('charm',1); return; }
  } else await say('chocolat','(지, 지금이다! 놀란 틈에!)', {style:'thought', face:'smile'});
  const cr=await casting(boy); if(!cr) return;
  if(cr==='perfect' && col!==UPGRADE[col]) toast(`✨ ${HEARTS[col].name} → ${HEARTS[UPGRADE[col]].name} 업그레이드!`);
  if(cr==='perfect') col=UPGRADE[col];
  await applyEff({heart:col, from:boy});
  if(col==='noir'){ setFace(boy,'panic'); await say('duke','쇼콜라! 그건 노아르야! 질투의 어둠이 묻어 있다고! 함부로 다루지 마!',{face:'panic'}); }
  else if(col!=='pis'){

    await say('narr',`하트를 빼앗긴 ${B.name}은(는) 방금 그 두근거림을 잊은 듯 멍하니 서 있다…`,{});

async function ritual(){
  setBG('makai',2); setCast([{id:'candy'}]);

  if(G.hearts.noir>=4) key='noir';
  else if(G.aff.pierre>=70 && G.trust>=2) key='pierre';
  else if(G.score>=G.vanilla) key='queen';
  else key='vanilla';
  if(key==='pierre'){ setCast([{id:'chocolat'},{id:'pierre'}]); await say('pierre','…쇼콜라!',{face:'panic', speed:true}); }
  return showEnding(key);
}
function showEnding(key){
  const E=ENDINGS[key];
  hideDlg(); $('menu').classList.remove('show'); ['hud','case','wardBtn'].forEach(id=>$(id).style.display='none');
  setBG(E.bg,2);
  const art={queen:[['chocolat','smile'],['candy','smile']], pierre:[['chocolat','smile'],['pierre','smile']], vanilla:[['vanilla','smile'],['chocolat','smile']], noir:[['chocolat','panic']]}[key];
  $('endingArt').innerHTML=art.map(([id,f])=>drawPerson(id,f,'full',id==='chocolat'?G.look:null)).join('');
  $('endTitle').textContent=E.title; $('endText').textContent=E.text;
  $('ending').classList.toggle('noir', !!E.dark);
  $('endScore').innerHTML=`최종 ${fmt(G.score)} 에클 vs 바닐라 ${fmt(G.vanilla)} 에클<br><small>${HEART_ORDER.map(k=>`${HEARTS[k].name} ${G.hearts[k]}`).join(' · ')}</small>`;
  $('ending').classList.add('show'); $('ending').scrollTop=0;
  Snd.sfx(key==='noir'?'sad':'fanfare');
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ---------- 메인 루프 ---------- */
let running=false;
async function mainLoop(){
  running=true;
  while(running){
    if(G.slot>2){ G.slot=2; await nightEnd(); G.slot=0; G.day++; saveGame(true); toast('🌙 자동 저장 완료'); }
    await stepOnce();
  }
}
async function stepOnce(){
  renderHUD(); setBG(SLOT_BG[G.slot]); setCast([{id:'chocolat'}]);
  const d=G.day, s=G.slot, st=G.story;
  if(d===1&&s===0&&!st.pro){ st.pro=1; await stPrologue(); }
  if(d===3&&s===1&&!st.metP){ await stPierre(); }
  if(d===8&&s===2&&!st.sofa){ st.sofa=1; await stSofa(); }
  if(d===12&&s===1&&!st.noir){ st.noir=1; await stNoir(); }
  if(d===16&&s===0&&!st.mid){ st.mid=1; await stMid(); }
  if(d===20&&s===2&&!st.ogre){ st.ogre=1; await stOgre(); G.slot++; return; }
  if(d===25&&s===1&&!st.conf){ st.conf=1; await stConfess(); }
  if(d>=5&&s===1&&!st.duel){ st.duel=1; await stDuelIntro(); G.slot++; return; }
  if(d===30&&s===2){ running=false; await ritual(); return; }
  if(G.forced){ G.forced=false; await doRest(true); }
  else {
    setBG(SLOT_BG[G.slot]); setCast([{id:'chocolat'}]);
    const r=await showMenu();
    if(r.abort) return;
    if(r.act==='study') await doStudy();
    else if(r.act==='heart') await doHeart(r.boy);
    else if(r.act==='magic') await doMagic();
    else if(r.act==='rest') await doRest(false);
    else if(r.act==='walk') await doWalk();
    else if(r.act==='duel') await doDuel();
  }
  if(G.hp<=0){ G.hp=0; G.forced=true; toast('😵 체력 0! 다음 턴은 강제 휴식'); }
  G.slot++; renderHUD();
}

$('app').insertAdjacentHTML('beforeend',`<div class="screen" id="mini"><h2 class="mt" id="mT"></h2><div class="mh" id="mH"></div><div id="mArea"></div><div id="mTime"><i id="mTi"></i></div><div id="mInfo"></div><button id="mTap">연타!</button></div>`);

function miniOpen(title, help, tapLabel){
  miniActive=true; hideDlg(); $('menu').classList.remove('show');
  $('mT').textContent=title; $('mH').innerHTML=help; $('mInfo').textContent='';
  $('mTap').style.display=tapLabel?'block':'none'; $('mTap').textContent=tapLabel||'';
  $('mArea').innerHTML=''; $('mTi').style.width='100%'; $('mini').classList.add('show');
}
function miniClose(){ miniActive=false; $('mini').classList.remove('show'); $('mTap').onpointerdown=null; }
function mpop(txt,color){ const d=document.createElement('div'); d.className='mpop'; d.textContent=txt; if(color) d.style.webkitTextStrokeColor=color; $('mArea').appendChild(d); setTimeout(()=>d.remove(),720); }
async function countdown(){
  for(const t of ['3','2','1','START!']){ mpop(t); Snd.sfx(t==='START!'?'level':'tick'); await wait(t==='START!'?500:650); }
}
/* 공용 입력: Space / 탭 버튼 */
function onPress(fn){
  const key=e=>{ if(e.code==='Space'||e.key===' '){ e.preventDefault(); e.stopPropagation(); if(!e.repeat) fn(); } };
  document.addEventListener('keydown',key,true);
  $('mTap').onpointerdown=e=>{ e.preventDefault(); fn(); };
  return ()=>{ document.removeEventListener('keydown',key,true); $('mTap').onpointerdown=null; };
}

/* ---------- ① 바닐라와 줄다리기 (Space 연타) ---------- */
function tugOfWar(){
  return new Promise(async res=>{
    miniOpen('⚔ 하트 줄다리기 ⚔','<b>Space</b>를 연타하거나 아래 버튼을 마구 눌러요! 하트 깃발을 왼쪽 선까지 끌어오면 승리!<br>블랑카가 응원하면 바닐라의 힘이 세져요. 정신 차려요!','💗 당겨라! (Space)');
    const A=$('mArea');
    A.innerHTML=`<div class="tline" style="left:18%"></div><div class="tline" style="left:82%"></div><div class="rope"></div>
      <div class="tugChar" id="tC" style="left:-4%">${drawPerson('chocolat','normal','upper',G.look)}</div>
      <div class="tugChar" id="tV" style="right:-4%">${drawPerson('vanilla','normal','upper')}</div>
      <div class="tmark" id="tM" style="left:50%">${drawHeart('pink',44)}</div>
      <div style="position:absolute;right:30%;top:8%;width:15%" id="tB">${drawPet('mouse','normal')}</div>`;
    let pos=0, t=0, presses=0, surge=0, nextSurge=2.5, lastFace='normal', combo=0, lastPress=0;
    const LIMIT=15, myPow=4.6+G.hp/100*1.2+G.magic/80, vanPow=15+G.day*.55;
    await countdown();
    const off=onPress(()=>{ pos+=myPow*(surge>0?.85:1); presses++; const now=performance.now(); combo = now-lastPress<160 ? combo+1 : 0; lastPress=now;
      Snd.sfx('tick'); if(combo===12){ mpop('쇼콜라 파워!!'); pos+=8; } });
    let last=performance.now(), done=false;
    const loop=now=>{
      if(done) return;
      const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
      nextSurge-=dt; if(nextSurge<=0){ surge=.9; nextSurge=2+Math.random()*2.5; mpop('블랑카 응원!','#8fa6ff'); }
      if(surge>0) surge-=dt;
      pos-=vanPow*(surge>0?2.3:1)*dt*(1+Math.sin(t*3)*.25);
      pos=Math.max(-100,Math.min(100,pos));
      $('tM').style.left=(50-pos*.32)+'%';
      $('tC').style.transform=`translateX(${-pos*.15}px) rotate(${-pos*.05}deg)`; $('tV').style.transform=`translateX(${-pos*.15}px) rotate(${-pos*.05}deg)`;
      $('tB').style.transform=surge>0?`translateY(${Math.sin(t*30)*6}px) scale(1.2)`:'none';
      const f = pos>25?'smile':pos<-25?'panic':'normal';
      if(f!==lastFace){ lastFace=f; $('tC').innerHTML=drawPerson('chocolat',f,'upper',G.look); $('tV').innerHTML=drawPerson('vanilla',f==='smile'?'panic':f==='panic'?'smile':'normal','upper'); }
      $('mTi').style.width=Math.max(0,(1-t/LIMIT)*100)+'%';
      $('mInfo').textContent=`연타 ${presses}회 · 남은 시간 ${Math.max(0,LIMIT-t).toFixed(1)}초`;
      if(pos>=100||pos<=-100||t>=LIMIT){
        done=true; off(); const win = pos>=100 || (t>=LIMIT && pos>0);
        mpop(win?'WIN!!':'LOSE…', win?'#e0457f':'#5a6ab8'); Snd.sfx(win?'level':'sad');
        setTimeout(()=>{ miniClose(); res(win); },1300); return;
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

/* ---------- ② 아그랑디스망 타이밍 (결계 안정) ---------- */
function timingGame(){
  return new Promise(async res=>{
    miniOpen('✦ 아그랑디스망 ✦','움직이는 별이 <b style="color:#ffe36b">결계 존</b>에 들어왔을 때 <b>Space</b> 또는 버튼! 한가운데 <b style="color:#ff5fa2">하트 존</b>이면 퍼펙트 — 하트가 한 단계 진한 색이 돼요!','✦ 결계 고정! (Space)');
    const A=$('mArea');
    const zw=Math.min(40, 16+G.magic/4), zc=25+Math.random()*50, pw=6;
    A.style.background='radial-gradient(circle,#5a2a7a,#1c0a2e)';
    A.innerHTML=`<div style="position:absolute;left:8%;right:8%;top:46%;height:34px;border-radius:17px;background:#2a1440;border:3px solid #f3c98b">
      <div style="position:absolute;top:0;bottom:0;left:${zc-zw/2}%;width:${zw}%;background:rgba(255,227,107,.55);border-radius:12px"></div>
      <div style="position:absolute;top:-4px;bottom:-4px;left:${zc-pw/2}%;width:${pw}%;background:#ff5fa2;border-radius:6px;box-shadow:0 0 10px #ff5fa2"></div>
      <div id="tgS" style="position:absolute;top:-10px;width:50px;height:50px;margin-left:-25px"><svg viewBox="0 0 40 40"><path d="${starPath(20,20,19,8)}" fill="#fff6c8" stroke="#ffb3d1" stroke-width="2"/></svg></div></div>
      <div style="position:absolute;left:0;right:0;top:12%;text-align:center;font-size:40px">💗</div>`;
    await countdown();
    let x=0, dir=1, t=0, done=false, last=performance.now();
    const speed=70+G.day*2.2;
    const finish=r=>{ if(done) return; done=true; off(); mpop(r==='perfect'?'PERFECT!!':r==='good'?'GOOD!':'MISS…', r==='miss'?'#5a6ab8':'#e0457f');
      Snd.sfx(r==='miss'?'sad':r==='perfect'?'shard':'level'); A.style.background=''; setTimeout(()=>{ miniClose(); res(r); },900); };
    const off=onPress(()=>{ const d=Math.abs(x-zc); finish(d<=pw/2+1?'perfect':d<=zw/2?'good':'miss'); });
    const loop=now=>{
      if(done) return;
      const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
      x+=dir*speed*dt*(1+Math.sin(t*2.3)*.35); if(x>=100){x=100;dir=-1;} if(x<=0){x=0;dir=1;}
      $('tgS').style.left=x+'%'; $('mTi').style.width=Math.max(0,(1-t/5)*100)+'%';
      if(t>=5) return finish('miss');
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

/* ---------- ③ 에클 조각 받기 (← → / 드래그) ---------- */
function ecruRain(){
  return new Promise(async res=>{
    miniOpen('💰 로비의 특훈: 에클 조각 받기','<b>← →</b> 방향키 또는 화면을 드래그해서 보석함으로 하트 조각을 받아요! <b>검은 노아르</b>는 피하세요!',null);
    const A=$('mArea');
    A.innerHTML=`<div class="basket" id="bk" style="left:50%">${drawCase(1)}</div>`;
    await countdown();
    let bx=50, t=0, got=0, items=[], spawn=0, done=false, last=performance.now(), keys={};
    const LIMIT=15, VAL={pis:10,orange:60,green:70,pink:200,noir:-150};
    const kd=e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ keys[e.key]=e.type==='keydown'; e.preventDefault(); } };
    document.addEventListener('keydown',kd,true); document.addEventListener('keyup',kd,true);
    const mv=e=>{ const r=A.getBoundingClientRect(); bx=Math.max(6,Math.min(94,(e.clientX-r.left)/r.width*100)); };
    A.addEventListener('pointermove',mv); A.addEventListener('pointerdown',mv);
    const loop=now=>{
      if(done) return;
      const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
      if(keys.ArrowLeft) bx-=70*dt; if(keys.ArrowRight) bx+=70*dt; bx=Math.max(6,Math.min(94,bx));
      $('bk').style.left=bx+'%';
      spawn-=dt;
      if(spawn<=0){ spawn=.35+Math.random()*.35-Math.min(.2,t*.01);
        const r=Math.random(), type=r<.35?'pis':r<.62?'orange':r<.78?'green':r<.88?'pink':'noir';
        const el=document.createElement('div'); el.className='fall'; el.innerHTML=drawHeart(type,38); A.appendChild(el);
        items.push({el,type,x:5+Math.random()*90,y:-8,v:28+Math.random()*22+t*1.5}); }
      for(const it of items){ it.y+=it.v*dt; it.el.style.left=it.x+'%'; it.el.style.top=it.y+'%';
        if(it.y>82 && it.y<96 && Math.abs(it.x-bx)<9 && !it.dead){ it.dead=true; it.el.remove(); got+=VAL[it.type];
          if(it.type==='noir'){ mpop('노아르!','#2a1428'); Snd.sfx('sad'); } else { Snd.sfx('tick'); if(it.type==='pink') mpop('+200'); } }
        if(it.y>105 && !it.dead){ it.dead=true; it.el.remove(); } }
      items=items.filter(i=>!i.dead);
      $('mTi').style.width=Math.max(0,(1-t/LIMIT)*100)+'%'; $('mInfo').textContent=`모은 에클 ${fmt(got)} · ${Math.max(0,LIMIT-t).toFixed(1)}초`;
      if(t>=LIMIT){ done=true; document.removeEventListener('keydown',kd,true); document.removeEventListener('keyup',kd,true);
        mpop('FINISH!'); Snd.sfx('level'); setTimeout(()=>{ miniClose(); res(Math.max(0,got)); },1100); return; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

/* ---------- ④ 오그르 퇴치 (탭/클릭) ---------- */

    let hits=0, t=0, done=false, last=performance.now(), spawn=0;
    const ogreSVG=`<svg viewBox="0 0 100 100"><path d="M50,8 Q86,10 90,52 Q94,92 50,94 Q6,92 10,52 Q14,10 50,8Z" fill="#1a0a24" stroke="#6a2a8a" stroke-width="4"/>
      <path d="M22,20 L14,2 L34,14Z M78,20 L86,2 L66,14Z" fill="#1a0a24"/><ellipse cx="34" cy="46" rx="9" ry="6" fill="#ff2a4a"/><ellipse cx="66" cy="46" rx="9" ry="6" fill="#ff2a4a"/>
      <path d="M30,70 L38,62 L46,70 L54,62 L62,70 L70,62" stroke="#ff7fb6" stroke-width="3" fill="none"/></svg>`;
    const loop=now=>{
      if(done) return;
      const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt; spawn-=dt;
      if(spawn<=0){ spawn=.55+Math.random()*.4;
        const o=document.createElement('div'); o.className='ogre'; o.innerHTML=ogreSVG;
        o.style.left=(15+Math.floor(Math.random()*3)*35)+'%'; o.style.top=(22+Math.floor(Math.random()*3)*28)+'%';
        o.onpointerdown=e=>{ e.preventDefault(); if(o.classList.contains('hit')) return; o.classList.add('hit'); hits++; Snd.sfx('shard'); mpop('⚡'); setTimeout(()=>o.remove(),300); };
        A.appendChild(o); setTimeout(()=>{ if(!o.classList.contains('hit')) o.remove(); }, 900); }
      $('mTi').style.width=Math.max(0,(1-t/12)*100)+'%'; $('mInfo').textContent=`퇴치 ${hits} / ${need}`;

const UPGRADE={pis:'orange', orange:'pink', green:'pink', pink:'violet', violet:'crimson', crimson:'crimson', noir:'pis'};
async function doDuel(){
  G.duelDay=G.day;
  setBG('road'); setCast([{id:'chocolat'},{id:'vanilla'},{id:'blanca'}]);
  await say('blanca','바닐라 님! 오늘도 쇼콜라 따위 이겨 버려요~!',{face:'smile'});
  await say('vanilla','쇼콜라… 오늘은 나도 안 질 거야!',{face:'normal'});
  await say('chocolat','좋아! 이기면 네가 모은 하트 하나 가져간다!',{face:'smile', speed:true, style:'shout'});
  Snd.play('battle');
  const win=await tugOfWar();
  curBG=''; setBG('road');
  setCast([{id:'chocolat',face:win?'smile':'panic'},{id:'vanilla',face:win?'panic':'smile'}]);
  if(win){
    const pool=G.day<10?['orange','orange','pink','green']:G.day<20?['orange','pink','pink','violet']:['pink','violet','violet','crimson'];
    let type=pick(pool); const val=HEARTS[type].ecru;
    if(G.vanilla<val) type='orange';
    G.vanilla=Math.max(0,G.vanilla-HEARTS[type].ecru);
    await say('vanilla','으앙… 내 하트가…!',{face:'panic'});
    await say('narr',`바닐라의 보석함에서 ${HEARTS[type].name} 하트가 튀어나왔다!`,{flash:true, tone:true});
    await applyEff({heart:type, from:'vanilla', bond:3});
    await say('vanilla','…다음엔 내가 이길 거야. 좋은 승부였어, 쇼콜라.',{face:'smile'});
  } else {
    await say('blanca','오호호! 역시 바닐라 님! 벌칙으로 용돈은 압수~',{face:'smile'});
    await applyEff({ecru:-300, hp:-10, bond:3});
    await say('vanilla','미, 미안해 쇼콜라… 다음에 또 하자!',{face:'normal'});
  }
}

  $('caseList').innerHTML=HEART_ORDER.map(k=>`<div class="heartRow">${drawHeart(k,26)}<div><b>${HEARTS[k].name}</b> × ${G.hearts[k]}<br><small style="color:#8a5a86">${HEARTS[k].desc} · ${HEARTS[k].ecru?fmt(HEARTS[k].ecru)+' 에클':'???'}</small></div></div>`).join('')
    + `<hr style="border:0;border-top:2px dashed #ffb3d1"><div class="heartRow">♣ 바닐라와의 우정 ${G.bond} · ❄ 피에르 ${G.aff.pierre}</div>`
    + BOY_IDS.filter(id=>id!=='pierre').map(id=>`<div class="heartRow"><b>${BOYS[id].name}</b><small>${BOYS[id].desc}</small><span style="margin-left:auto;color:#e0457f;white-space:nowrap">${hearts(G.aff[id])}</span></div>`).join('');
  $('caseView').classList.add('show');
};
$('bCaseClose').onclick=()=>{ Snd.sfx('click'); $('caseView').classList.remove('show'); };

/* ---------- 시작 / 버튼 ---------- */
function startGame(state){
  G=state;
  ['title','ending'].forEach(id=>$(id).classList.remove('show'));
  $('hud').style.display='flex'; $('case').style.display='block'; $('wardBtn').style.display='block';
  curBG=''; renderHUD();
  if(!running) mainLoop();
}
let audioStarted=false;
document.addEventListener('pointerdown',()=>{ if(audioStarted) return; audioStarted=true; Snd.init(); Snd.play(fxMode==='star'?'night':'day'); },{capture:true});
$('bookCover').onclick=()=>{ Snd.init(); Snd.sfx('shard'); $('bookCover').classList.add('open'); $('tapHint').style.visibility='hidden'; };
$('bNew').onclick=()=>{ Snd.init(); Snd.sfx('click'); startGame(newState()); };
$('bCont').onclick=()=>{ const d=loadData(); if(!d) return toast('저장된 데이터가 없어요'); Snd.sfx('click'); startGame(Object.assign(newState(),d)); };
$('bRetry').onclick=()=>{ Snd.sfx('click'); $('ending').classList.remove('show'); showTitle(); };
$('bSave').onclick=()=>{ Snd.sfx('click'); if(!canSave) return toast('행동을 고르는 중에만 저장할 수 있어요'); saveGame(false); };
$('bLoad').onclick=()=>{
  Snd.sfx('click');
  if(!canSave) return toast('행동을 고르는 중에만 불러올 수 있어요');
  const d=loadData(); if(!d) return toast('저장된 데이터가 없어요');
  G=Object.assign(newState(),d); curBG=''; renderHUD(); toast('📖 불러왔어요!');
  if(menuResolve){ const r=menuResolve; menuResolve=null; canSave=false; $('menu').classList.remove('show'); r({abort:true}); }
};
$('bMute').onclick=()=>{ Snd.init(); const m=Snd.toggleMute(); $('bMute').textContent=m?'🔇':'♪'; try{localStorage.setItem(MUTE_KEY,m?'1':'0');}catch(e){} };

function showTitle(){
  running=false;
  ['hud','case','wardBtn'].forEach(id=>$(id).style.display='none'); hideDlg(); $('menu').classList.remove('show');
  $('title').classList.add('show'); $('bookCover').classList.remove('open'); $('tapHint').style.visibility='visible';
  $('titleSky').innerHTML=drawTitleSky(); $('bookEmb').innerHTML=drawEmblem();
  $('titleChars').innerHTML=drawPerson('chocolat','smile','upper')+drawPerson('vanilla','normal','upper');
  $('bCont').disabled=!loadData();
  curBG=''; $('bg').innerHTML=drawBG('makai',2); fxMode='star'; Snd.play('night');
}
$('cornerL').innerHTML=drawCorner(); $('cornerR').innerHTML=drawCorner();
try{ if(localStorage.getItem(MUTE_KEY)==='1'){ Snd.mutedInit=true; $('bMute').textContent='🔇'; } }catch(e){}
showTitle();
</script>
</body>
</html>
